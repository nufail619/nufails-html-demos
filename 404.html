<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Page not found — Website Design Demos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/hub.css">
  <style>
    .not-found { min-height: calc(100svh - 144px); display: grid; place-items: center; text-align: center; }
    .not-found-inner { padding: 45px 20px; }
    .error-code { color: #6d5dfc; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .not-found h1 { margin: 12px auto; font-size: clamp(50px, 8vw, 82px); }
    .not-found p { color: #777580; font-size: 16px; margin: 13px 0 25px; }
    .home-button { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 0 20px; border-radius: 8px; background: #6d5dfc; color: #fff; text-decoration: none; font-size: 13px; font-weight: 800; }
    .home-button:hover { background: #5443e8; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to message</a>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Website Design Demos home"><span class="mark" aria-hidden="true">W</span><span>Design demos</span></a>
    <span class="header-note">Page not found</span>
  </header>
  <main id="main" class="not-found">
    <div class="not-found-inner">
      <span class="error-code">404 · Missing page</span>
      <h1>Nothing here<br><span>for now.</span></h1>
      <p>The page may have moved, or the address may be incorrect.</p>
      <a class="home-button" href="/">Back to all demos <span aria-hidden="true">↗</span></a>
    </div>
  </main>
  <footer class="site-footer"><span>Sample website concepts</span><span>Designed to explore what’s possible <span class="footer-spark" aria-hidden="true">✳</span></span></footer>
</body>
</html>
